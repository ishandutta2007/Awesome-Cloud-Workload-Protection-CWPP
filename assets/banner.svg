<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>

    <style>
      .glow-orb-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .stream-line {
        stroke-dasharray: 8 16;
        animation: dash 12s linear infinite;
      }
      .radar-wave {
        animation: radar 4s ease-out infinite;
        transform-origin: 1040px 180px;
      }
      .pill-float-1 {
        animation: float1 6s ease-in-out infinite alternate;
      }
      .pill-float-2 {
        animation: float2 7s ease-in-out infinite alternate;
      }
      .pill-float-3 {
        animation: float3 8s ease-in-out infinite alternate;
      }

      @keyframes dash {
        to {
          stroke-dashoffset: -200;
        }
      }
      @keyframes radar {
        0% {
          r: 20;
          opacity: 0.8;
        }
        100% {
          r: 140;
          opacity: 0;
        }
      }
      @keyframes pulse1 {
        0% { transform: scale(0.9) translate(0px, 0px); opacity: 0.4; }
        100% { transform: scale(1.15) translate(30px, 20px); opacity: 0.7; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1.1) translate(0px, 0px); opacity: 0.3; }
        100% { transform: scale(0.85) translate(-40px, -20px); opacity: 0.6; }
      }
      @keyframes float1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(10px); }
      }
      @keyframes float3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Background Orbs (Behind everything) -->
  <g filter="url(#softGlow)">
    <circle class="glow-orb-1" cx="200" cy="80" r="130" fill="#0284c7" />
    <circle class="glow-orb-2" cx="1020" cy="260" r="150" fill="#6366f1" />
    <circle class="glow-orb-1" cx="600" cy="320" r="100" fill="#a855f7" />
  </g>

  <!-- Dynamic Cyber Grid & Stream Lines (Background) -->
  <g opacity="0.4">
    <path class="stream-line" d="M 0,220 Q 300,120 600,200 T 1200,160" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 0,140 Q 400,260 800,160 T 1200,240" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <path class="stream-line" d="M 0,280 Q 350,220 700,280 T 1200,110" fill="none" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Right Side: Dynamic Radar & Security Telemetry Node (Keeps Foreground Clean) -->
  <g transform="translate(0, 0)">
    <circle cx="1040" cy="180" r="110" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="1040" cy="180" r="75" fill="none" stroke="#334155" stroke-width="1.5" />
    <circle cx="1040" cy="180" r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    
    <!-- Radar animated wave -->
    <circle class="radar-wave" cx="1040" cy="180" r="30" fill="none" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Central Shield / Workload Protection Icon -->
    <circle cx="1040" cy="180" r="28" fill="url(#shieldGrad)" filter="url(#glow)" />
    <!-- Shield Path -->
    <path d="M 1040,166 L 1052,171 V 183 C 1052,192 1046,198 1040,201 C 1034,198 1028,192 1028,183 V 171 Z" fill="#ffffff" />

    <!-- Surrounding Active Workload Nodes (Floating) -->
    <!-- VM Node -->
    <g class="pill-float-1" transform="translate(930, 95)">
      <rect width="80" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <text x="40" y="17" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" text-anchor="middle">☁️ VMs</text>
    </g>
    <!-- Container / K8s Node -->
    <g class="pill-float-2" transform="translate(1060, 80)">
      <rect width="90" height="26" rx="13" fill="#0f172a" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
      <text x="45" y="17" fill="#818cf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" text-anchor="middle">☸️ Kubernetes</text>
    </g>
    <!-- eBPF / Runtime Node -->
    <g class="pill-float-3" transform="translate(950, 260)">
      <rect width="95" height="26" rx="13" fill="#0f172a" stroke="#c084fc" stroke-width="1" opacity="0.9"/>
      <text x="47" y="17" fill="#c084fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ eBPF Engine</text>
    </g>
    <!-- Agentless Node -->
    <g class="pill-float-1" transform="translate(1070, 255)">
      <rect width="95" height="26" rx="13" fill="#0f172a" stroke="#34d399" stroke-width="1" opacity="0.9"/>
      <text x="47" y="17" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" text-anchor="middle">🛡️ Agentless</text>
    </g>
  </g>

  <!-- Foreground: Title, Subtitle, and Tagline (Prominent & Clear) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">CLOUD WORKLOAD SECURITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" fill="url(#textGrad)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      Awesome CWPP &amp; CNAPP
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500">
      The Curated Ecosystem for Cloud Workload Protection
    </text>

    <!-- Description / Scope -->
    <text x="0" y="215" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400">
      Enterprise SaaS &amp; Open-Source Tools • Runtime Defense • eBPF Tracing • Kubernetes Hardening
    </text>

    <!-- Feature Attribute Badges (Foreground) -->
    <g transform="translate(0, 252)">
      <!-- Badge 1 -->
      <g>
        <rect width="130" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="65" y="19" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔍 Vulnerability</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(142, 0)">
        <rect width="135" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="67" y="19" fill="#818cf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Real-Time eBPF</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(289, 0)">
        <rect width="145" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="72" y="19" fill="#c084fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="middle">📊 CIS Benchmarks</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(446, 0)">
        <rect width="130" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <text x="65" y="19" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎯 Attack Paths</text>
      </g>
    </g>
  </g>
</svg>
